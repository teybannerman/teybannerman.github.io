function getDelta(journey) {
  const { metric } = journey;
  const gap = metric.lower ? metric.target - metric.actual : metric.actual - metric.target;
  const abs = parseFloat(Math.abs(gap).toFixed(2)); // guard float artifacts (e.g. 3.0 - 2.1)
  if (gap > 0) return { text: `${abs}${metric.unit} ahead`, positive: true, icon: metric.lower ? "ArrowDownRight" : "ArrowUpRight" };
  if (gap < 0) return { text: `${abs}${metric.unit} behind`, positive: false, icon: metric.lower ? "ArrowUpRight" : "ArrowDownRight" };
  return { text: "On target", positive: true, icon: "Minus" };
}

function getBoldnessRatio(h) {
  const total = h.fix + h.optimise + h.differentiate;
  return total ? Math.round((h.differentiate / total) * 100) : 0;
}

function getFlag(j) {
  if (j.insights.new > 0 && j.insights.oldestNewDays >= 14)
    return { text: `${j.insights.new} insight${j.insights.new > 1 ? "s" : ""} unactioned (${j.insights.oldestNewDays}d)`, severity: "red", icon: "AlertCircle" };
  if (j.insights.deferred > 2 && j.insights.oldestDeferredDays > 30)
    return { text: `${j.insights.deferred} deferred (oldest ${j.insights.oldestDeferredDays}d)`, severity: "amber", icon: "Clock" };
  if (j.testing.actual < j.testing.target)
    return { text: `Testing ${j.testing.actual}/${j.testing.target} target`, severity: "amber", icon: "AlertTriangle" };
  if (getBoldnessRatio(j.hypotheses) === 0 && (j.hypotheses.fix + j.hypotheses.optimise) > 0)
    return { text: "No differentiation hypotheses", severity: "amber", icon: "Zap" };
  if (j.tech.latency > 400 || j.tech.errorRate > 2)
    return { text: "Tech health degraded", severity: "red", icon: "Shield" };
  if (getDelta(j).positive)
    return { text: getDelta(j).text, severity: "green", icon: "CheckCircle2" };
  return { text: "Tracking", severity: "neutral", icon: "Target" };
}

function getSquadAgg(squadId) {
  const js = JOURNEYS.filter((j) => j.squadId === squadId);
  return {
    avgProcess: Math.round(js.reduce((s, j) => s + j.processHealth, 0) / js.length),
    totalUnactioned: js.reduce((s, j) => s + j.insights.new, 0),
    avgBoldness: Math.round(js.reduce((s, j) => s + getBoldnessRatio(j.hypotheses), 0) / js.length),
    worstRag: js.some((j) => j.rag === "red") ? "red" : js.some((j) => j.rag === "amber") ? "amber" : "green",
  };
}

function computePatterns() {
  const patterns = [];
  const countByJourney = {};
  ALL_INSIGHTS.forEach((i) => { countByJourney[i.journeyId] = (countByJourney[i.journeyId] || 0) + 1; });
  const sorted = Object.entries(countByJourney).sort((a, b) => b[1] - a[1]);
  const topTwo = sorted.slice(0, 2);
  const topCount = topTwo.reduce((s, [, c]) => s + c, 0);
  const topPct = Math.round((topCount / ALL_INSIGHTS.length) * 100);
  const topNames = topTwo.map(([id]) => JOURNEYS.find((j) => j.id === id)?.name).join(" and ");
  patterns.push(`${topNames} account for ${topPct}% of all experience insights - friction is concentrated, not distributed.`);

  const staleHigh = ALL_INSIGHTS.filter((i) => i.status === "deferred" && i.daysOld > 30 && i.severity === "high");
  if (staleHigh.length > 0)
    patterns.push(`${staleHigh.length} high-severity insight${staleHigh.length > 1 ? "s have" : " has"} been deferred for over 30 days. Known significant friction is not being addressed.`);

  const diffTotal = ALL_INSIGHTS.filter((i) => i.type === "differentiate").length;
  const diffDeferred = ALL_INSIGHTS.filter((i) => i.type === "differentiate" && i.status === "deferred").length;
  if (diffTotal > 0 && diffDeferred / diffTotal >= 0.5)
    patterns.push(`${Math.round((diffDeferred / diffTotal) * 100)}% of differentiation insights are deferred. The ideas that would make this product distinctive are the ones being deprioritised.`);

  return patterns;
}

/* ----------------------------------------------------------------------------
   PORTFOLIO OVERVIEW METRICS  (section 6.6)
   Some are computed from journey data; retention & product depth are launch
   assumptions (no per-customer data in this prototype).
   -------------------------------------------------------------------------- */
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));

// relative share of customer traffic per journey (assumption, sums to 100)
const TRAFFIC = {
  onboarding: 12, subscription: 8, "account-mgmt": 14, payments: 22,
  casa: 14, cards: 16, lending: 6, liquidity: 8,
};

// assumed launch trends (6 sprints) — current = last value
const RETENTION_TREND = [81, 83, 84.5, 85.5, 86.4, 87.4];   // % active at 90 days
const DEPTH_TREND = [1.8, 1.9, 2.05, 2.2, 2.3, 2.4];        // products in active use / customer

function computeAdvocacy() {
  const value = +(JOURNEYS.reduce((s, j) => s + j.advocacy, 0) / JOURNEYS.length).toFixed(1);
  const trend = [0, 1, 2, 3, 4, 5].map((k) =>
    +(JOURNEYS.reduce((s, j) => s + j.advocacyTrend[k], 0) / JOURNEYS.length).toFixed(3)
  );
  return { value, trend };
}

// fraction of the original target-gap a journey has closed by sprint k (overshoot = fully closed)
function closureToDate(j, k) {
  const t = j.metric.target;
  const gapStart = j.metric.lower ? j.trend[0] - t : t - j.trend[0];
  if (gapStart <= 0) return 1;
  const gapNow = j.metric.lower ? j.trend[k] - t : t - j.trend[k];
  return clamp((gapStart - Math.max(gapNow, 0)) / gapStart, 0, 1);
}
function computeVelocity() {
  const trend = [0, 1, 2, 3, 4, 5].map((k) =>
    +(JOURNEYS.reduce((s, j) => s + closureToDate(j, k), 0) / JOURNEYS.length * 100).toFixed(1)
  );
  return { value: Math.round(trend[5]), trend };
}

function techScoreFor(j) {
  const lat = clamp(100 - (j.tech.latency - 100) * 0.18, 0, 100);
  const err = clamp(100 - j.tech.errorRate * 25, 0, 100);
  const up = clamp((j.tech.uptime - 98) * 50, 0, 100);
  return 0.4 * lat + 0.3 * err + 0.3 * up;
}
function computeTechScore() {
  const tw = JOURNEYS.reduce((s, j) => s + (TRAFFIC[j.id] || 0), 0);
  return Math.round(JOURNEYS.reduce((s, j) => s + techScoreFor(j) * (TRAFFIC[j.id] || 0), 0) / tw);
}

function computeThroughput() {
  let actioned = 0, total = 0;
  JOURNEYS.forEach((j) => { actioned += j.insights.actioned; total += j.insights.new + j.insights.actioned + j.insights.deferred; });
  const ratio = Math.round((actioned / total) * 100);
  const avgAge = Math.round(ALL_INSIGHTS.reduce((s, i) => s + i.daysOld, 0) / ALL_INSIGHTS.length);
  return { ratio, avgAge };
}

function buildPortfolioMetrics() {
  const adv = computeAdvocacy();
  const vel = computeVelocity();
  const tech = computeTechScore();
  const thr = computeThroughput();
  const techTrend = [73, 74, 75, 76, 77, tech];
  const thrTrend = [54, 56, 58, 60, 61, thr.ratio];

  // delta across the 6-sprint window (matches each sparkline's span)
  const win = (arr, dp, suffix = "") => {
    const raw = arr[arr.length - 1] - arr[0];
    const v = dp === 0 ? Math.round(raw) : +raw.toFixed(dp);
    return { delta: (v >= 0 ? "+" : "") + v + suffix, positive: v >= 0 };
  };
  // velocity is a cumulative-from-zero rate, so report the latest sprint's increment instead
  const step = (arr, suffix = "") => {
    const v = Math.round(arr[arr.length - 1] - arr[arr.length - 2]);
    return { delta: (v >= 0 ? "+" : "") + v + suffix, positive: v >= 0 };
  };
  // RAG status colour for the big value (higher = better for all six).
  // Amber tier renders as primary black — only green & red get a colour.
  const band = (v, g, a) => (v >= g ? C.green : v >= a ? C.primary : C.red);

  return [
    { label: "Retention", value: RETENTION_TREND[5], unit: "%", sub: "90-day active",
      ...win(RETENTION_TREND, 1), trend: RETENTION_TREND, accent: C.green, valueColor: band(RETENTION_TREND[5], 85, 70) },
    { label: "Product Depth", value: DEPTH_TREND[5], unit: "", sub: "products / customer",
      ...win(DEPTH_TREND, 1), trend: DEPTH_TREND, accent: C.indigo, valueColor: band(DEPTH_TREND[5], 3, 2) },
    { label: "Advocacy", value: adv.value, unit: "/5", sub: "north star · all journeys",
      ...win(adv.trend, 1), trend: adv.trend, accent: C.violet, valueColor: band(adv.value, 3.5, 2.5) },
    { label: "Experience Velocity", value: vel.value, unit: "%", sub: "of target gap closed",
      ...step(vel.trend, " pts"), trend: vel.trend, accent: C.green, valueColor: band(vel.value, 50, 25) },
    { label: "Technical Experience", value: tech, unit: "/100", sub: "traffic-weighted floor",
      ...win(techTrend, 0), trend: techTrend, accent: C.amber, valueColor: band(tech, 85, 70) },
    { label: "Insight Throughput", value: thr.ratio, unit: "%", sub: `actioned · avg ${thr.avgAge}d to refine`,
      ...win(thrTrend, 0), trend: thrTrend, accent: C.indigo, valueColor: band(thr.ratio, 70, 50) },
  ];
}

/* small colour helpers */
const processColour = (n) => (n >= 70 ? C.green : n >= 50 ? C.amber : C.red);
const advocacyColour = (n) => (n >= 3.5 ? C.green : n >= 2.5 ? C.amber : C.red);
const ageColour = (d) => (d > 30 ? C.red : d > 14 ? C.amber : C.muted);

const SEV = { red: C.red, amber: C.amber, green: C.green, neutral: C.muted };

          <ReferenceLine y={target} stroke={C.amber} strokeDasharray="4 3" />

const flowNodeH = (id) => 84 + (TRAFFIC[id] || 10) * 2;

function LegendDot({ color, label }) {
  return (
    <span style={{ display: "flex", alignItems: "center", gap: 6 }}>

    </span>
  );
}

function FlowMap({ onSelect }) {
  const byId = {};
  JOURNEYS.forEach((j) => {
    const p = FLOW_POS[j.id]; const h = flowNodeH(j.id);
    byId[j.id] = { j, x: FLOW_LAYER_X[p.layer], cy: p.cy, h, top: p.cy - h / 2 };

  return (
    <WhiteCard style={{ padding: 22 }}>
      <svg width="100%" viewBox="0 0 1200 540" style={{ display: "block" }}>
        {/* stage separators */}
        <line x1={710} y1={30} x2={710} y2={500} stroke="#E2E8F0" strokeDasharray="4 5" />
        <line x1={950} y1={30} x2={950} y2={500} stroke="#E2E8F0" strokeDasharray="4 5" />
        {/* stage labels */}

        {/* edges (customer progression) */}
        {FLOW_EDGES.map(([s, t], i) => {

        {JOURNEYS.map((j) => {

/* ============================================================================
   TRAJECTORY  — Performance × Momentum bubble matrix (framing B):
   Y = outcome attainment vs target, X = improvement engine (process health).
   Rosling sprint slider + comet trails + fly-in animation. Bubble = journey.
   ========================================================================== */
const TRAJ = {
  vbW: 1200, vbH: 660,
  L: 88, R: 1104, T: 50, B: 540,        // plot rect
  xDom: [25, 100], yDom: [30, 150],     // engine 0-100, attainment %
  xSplit: 60, ySplit: 100,              // healthy engine / on-target
};
// quadrant corner labels: bold name + plain-English condition gloss
const Q_LABELS = [
  { x: TRAJ.L + 12, y: TRAJ.T + 18, anchor: "start", name: "COASTING", gloss: "on target · engine fading" },
  { x: TRAJ.R - 12, y: TRAJ.T + 18, anchor: "end", name: "THRIVING", gloss: "on target · engine strong" },
  { x: TRAJ.L + 12, y: TRAJ.B - 30, anchor: "start", name: "STUCK", gloss: "behind target · engine weak" },
  { x: TRAJ.R - 12, y: TRAJ.B - 30, anchor: "end", name: "CLIMBING", gloss: "behind target · engine strong" },
];
const trajAtt = (j, k) => (j.metric.lower ? j.metric.target / j.trend[k] : j.trend[k] / j.metric.target) * 100;
const trajEng = (j, k) => j.processHealthTrend[k];
const trajR = (j) => 7 + Math.sqrt(TRAFFIC[j.id] || 8) * 4.4;
const trajQuad = (ex, ay) =>
  ay >= TRAJ.ySplit ? (ex >= TRAJ.xSplit ? "Thriving" : "Coasting")
                    : (ex >= TRAJ.xSplit ? "Climbing" : "Stuck");

function Trajectory({ t, trails, onSelect }) {
  const [hover, setHover] = useState(null);

  const sx = (x) => TRAJ.L + (x - TRAJ.xDom[0]) / (TRAJ.xDom[1] - TRAJ.xDom[0]) * (TRAJ.R - TRAJ.L);
  const sy = (y) => TRAJ.B - (y - TRAJ.yDom[0]) / (TRAJ.yDom[1] - TRAJ.yDom[0]) * (TRAJ.B - TRAJ.T);

  const headPos = (j) => {
    const tc = Math.min(t, 5), k0 = Math.floor(tc), k1 = Math.min(k0 + 1, 5), f = tc - k0;
    const ex = trajEng(j, k0) + (trajEng(j, k1) - trajEng(j, k0)) * f;
    const ay = trajAtt(j, k0) + (trajAtt(j, k1) - trajAtt(j, k0)) * f;
    return { px: sx(ex), py: sy(ay), ex, ay };
  };

  const K = Math.floor(Math.min(t, 5));
  const hoveredJ = hover ? JOURNEYS.find((j) => j.id === hover) : null;
  const hoveredHead = hoveredJ ? headPos(hoveredJ) : null;
  const STATUS = { green: "On track", amber: "At risk", red: "Off track" };

  return (
    <WhiteCard style={{ padding: 22 }}>
      {/* plain-English intro so the chart explains itself */}
      <div style={{ fontFamily: FONT_BODY, fontSize: 12.5, color: C.secondary, marginBottom: 14, lineHeight: 1.5, maxWidth: 820 }}>
        <b style={{ color: C.primary }}>Bubble</b> = journey. <b style={{ color: C.primary }}>Bubble size</b> = customers impacted. <b style={{ color: C.primary }}>Higher</b> = closer to its target;{" "}
        <b style={{ color: C.primary }}>further right</b> = the team is working harder to improve it (testing, bold bets, acting on insights).
        <b style={{ color: C.primary }}>Trail line</b> = trajectory over last 6 sprints.
      </div>

      <svg width="100%" viewBox={`0 0 ${TRAJ.vbW} ${TRAJ.vbH}`} style={{ display: "block" }}>
          {/* quadrant shading — TR green (thriving), BR yellow (climbing), BL red (stuck), TL white (coasting) */}
          <rect x={sx(TRAJ.xSplit)} y={TRAJ.T} width={TRAJ.R - sx(TRAJ.xSplit)} height={sy(TRAJ.ySplit) - TRAJ.T} fill="#DCFCE7" opacity={0.6} />
          <rect x={TRAJ.L} y={sy(TRAJ.ySplit)} width={sx(TRAJ.xSplit) - TRAJ.L} height={TRAJ.B - sy(TRAJ.ySplit)} fill="#FEE2E2" opacity={0.55} />
          <rect x={sx(TRAJ.xSplit)} y={sy(TRAJ.ySplit)} width={TRAJ.R - sx(TRAJ.xSplit)} height={TRAJ.B - sy(TRAJ.ySplit)} fill="#FEF9C3" opacity={0.55} />

          {/* gridlines + ticks */}
          {[50, 75, 100, 125, 150].map((v) => (
            <g key={"y" + v}>
              <line x1={TRAJ.L} y1={sy(v)} x2={TRAJ.R} y2={sy(v)} stroke="#F1F5F9" />
              <text x={TRAJ.L - 9} y={sy(v) + 3} textAnchor="end" fontSize={9} fill={C.muted} fontFamily={FONT_BODY}>{v}</text>
            </g>
          ))}
          {[40, 60, 80, 100].map((v) => (
            <g key={"x" + v}>
              <line x1={sx(v)} y1={TRAJ.T} x2={sx(v)} y2={TRAJ.B} stroke="#F8FAFC" />
              <text x={sx(v)} y={TRAJ.B + 16} textAnchor="middle" fontSize={9} fill={C.muted} fontFamily={FONT_BODY}>{v}</text>
            </g>
          ))}

          {/* quadrant split lines */}
          <line x1={TRAJ.L} y1={sy(TRAJ.ySplit)} x2={TRAJ.R} y2={sy(TRAJ.ySplit)} stroke={C.muted} strokeDasharray="5 4" strokeOpacity={0.45} />
          <line x1={sx(TRAJ.xSplit)} y1={TRAJ.T} x2={sx(TRAJ.xSplit)} y2={TRAJ.B} stroke={C.muted} strokeDasharray="5 4" strokeOpacity={0.45} />
          <text x={TRAJ.R - 6} y={sy(TRAJ.ySplit) - 6} textAnchor="end" fontSize={9} fill={C.green} fontFamily={FONT_BODY}>100% = on target</text>

          {/* quadrant labels: bold name + plain condition */}
          {Q_LABELS.map((q) => (
            <g key={q.name}>
              <text x={q.x} y={q.y} textAnchor={q.anchor} fontSize={11} fontWeight={700} fill={C.secondary} opacity={0.75} letterSpacing="0.5" fontFamily={FONT_BODY}>{q.name}</text>
              <text x={q.x} y={q.y + 13} textAnchor={q.anchor} fontSize={9} fill={C.muted} fontFamily={FONT_BODY}>{q.gloss}</text>
            </g>
          ))}

          {/* axis titles (plain English) */}
          <text x={(TRAJ.L + TRAJ.R) / 2} y={TRAJ.B + 38} textAnchor="middle" fontSize={11} fontWeight={700}
            fill={C.secondary} letterSpacing="0.5" fontFamily={FONT_BODY}>IMPROVEMENT ENGINE →</text>
          <text x={(TRAJ.L + TRAJ.R) / 2} y={TRAJ.B + 53} textAnchor="middle" fontSize={9.5}
            fill={C.muted} fontFamily={FONT_BODY}>how hard the team is working to improve it — testing, bold bets, acting on insights</text>
          <text transform={`translate(${TRAJ.L - 54}, ${(TRAJ.T + TRAJ.B) / 2}) rotate(-90)`} textAnchor="middle"
            fontSize={11} fontWeight={700} fill={C.secondary} letterSpacing="0.5" fontFamily={FONT_BODY}>% OF TARGET REACHED ↑</text>

          {/* comet trails + bubbles */}
          {JOURNEYS.map((j) => {
            const solid = RAG_SOLID[j.rag];
            const head = headPos(j);
            const isHover = hover === j.id;
            const r = trajR(j) * (isHover ? 1.14 : 1);
            let trail = null;
            if (trails && K >= 1) {
              const pts = [];
              for (let k = 0; k <= K; k++) pts.push([sx(trajEng(j, k)), sy(trajAtt(j, k))]);
              pts.push([head.px, head.py]);
              const d = pts.map((p, i) => (i === 0 ? "M" : "L") + p[0] + " " + p[1]).join(" ");
              trail = (
                <g>
                  <path d={d} fill="none" stroke={solid} strokeOpacity={0.28} strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" />
                  {pts.slice(0, -1).map((p, k) => (
                    <circle key={k} cx={p[0]} cy={p[1]} r={3} fill={solid} opacity={0.1 + 0.34 * (k / Math.max(K, 1))} />
                  ))}
                </g>
              );
            }
            return (
              <g key={j.id} style={{ cursor: "pointer" }} onClick={() => onSelect(j.id)}
                onMouseEnter={() => setHover(j.id)} onMouseLeave={() => setHover(null)}>
                {trail}
                <circle cx={head.px} cy={head.py} r={r} fill={solid} fillOpacity={0.7} stroke={solid} strokeWidth={1.5} />
                <text x={head.px} y={head.py + r + 13} textAnchor="middle" fontSize={11} fontWeight={600} fill={C.primary} fontFamily={FONT_BODY}>{j.name}</text>
              </g>
            );
          })}

          {/* hover tooltip */}
          {hoveredJ && (
            <foreignObject
              x={clamp(hoveredHead.px + trajR(hoveredJ) + 10, TRAJ.L, TRAJ.R - 172)}
              y={clamp(hoveredHead.py - 46, TRAJ.T, TRAJ.B - 102)}
              width={172} height={102} overflow="visible">
              <div style={{ background: C.white, border: `1px solid ${C.border}`, borderRadius: 10, boxShadow: SH.white, padding: "9px 11px" }}>
                <div style={{ fontFamily: FONT_BODY, fontWeight: 600, fontSize: 12, color: C.primary, marginBottom: 4 }}>{hoveredJ.name}</div>
                <div style={{ display: "flex", alignItems: "center", gap: 5, marginBottom: 3 }}>
                  <span style={{ width: 7, height: 7, borderRadius: "50%", background: RAG_SOLID[hoveredJ.rag] }} />
                  <span style={{ fontFamily: FONT_BODY, fontSize: 11, fontWeight: 600, color: RAG_SOLID[hoveredJ.rag] }}>{STATUS[hoveredJ.rag]}</span>
                </div>
                <div style={{ fontFamily: FONT_BODY, fontSize: 11, color: C.secondary }}>{Math.round(hoveredHead.ay)}% of target · engine {Math.round(hoveredHead.ex)}/100</div>
                <div style={{ fontFamily: FONT_BODY, fontSize: 11, color: C.muted, marginTop: 2 }}>{TRAFFIC[hoveredJ.id]}% of customers · {trajQuad(hoveredHead.ex, hoveredHead.ay)}</div>
              </div>
            </foreignObject>
          )}
        </svg>
      </WhiteCard>
  );
}

/* ============================================================================
   COMMAND CENTRE
   ========================================================================== */
function CommandCentre({ headline, headlineLoading, onSelect, board, onBoard }) {
  // Trajectory's Rosling state lives here so its controls can sit in the shared toggle row
  const [t, setT] = useState(5);
  const [trails, setTrails] = useState(true);
  const [replayKey, setReplayKey] = useState(0);
  const rafRef = useRef(null);

  // fly-in: auto-play t from 0 → 5 whenever the Trajectory board is (re)entered or replayed
  useEffect(() => {
    cancelAnimationFrame(rafRef.current);
    if (board !== "trajectory") return;
    setT(0);
    let start = null;
    const dur = 1500;
    const tick = (ts) => {
      if (start == null) start = ts;
      const p = Math.min(1, (ts - start) / dur);
      setT((1 - Math.pow(1 - p, 3)) * 5);
      if (p < 1) rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [board, replayKey]);

  const scrub = (v) => { cancelAnimationFrame(rafRef.current); setT(v); };

  const headerRight =
    board === "trajectory"
      ? <TrajectoryControls t={t} trails={trails} onScrub={scrub} onToggleTrails={() => setTrails((v) => !v)} onReplay={() => setReplayKey((k) => k + 1)} />
      : board === "flow"
      ? <FlowLegend />
      : null;

  return (
    <div>
      {/* toggle on the LEFT; board-specific controls on the RIGHT */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18, minHeight: 34 }}>
        <Segmented value={board} onChange={onBoard} options={[
          { id: "grid", label: "Grid", icon: LayoutGrid },
          { id: "flow", label: "Lifecycle Flow", icon: Network },
          { id: "trajectory", label: "Trajectory", icon: Orbit },
        ]} />
        {headerRight}
      </div>

      {board === "flow" || board === "trajectory" ? (
        // topline metrics run down the LEFT in negative space, beside the board card
        <div style={{ display: "grid", gridTemplateColumns: "192px 1fr", gap: 28, alignItems: "start", marginBottom: 24 }}>
          <PortfolioStats vertical />
          {board === "trajectory" ? <Trajectory t={t} trails={trails} onSelect={onSelect} /> : <FlowMap onSelect={onSelect} />}
        </div>
      ) : (
        <>
          <PortfolioStats />
          {SQUADS.map((squad) => {
            const js = JOURNEYS.filter((j) => j.squadId === squad.id);
            return (
              <div key={squad.id} style={{ marginBottom: 24 }}>
                <SquadSummaryRow squad={squad} />
                <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 14 }}>
                  {js.map((j) => <JourneyCard key={j.id} journey={j} onClick={onSelect} />)}
                </div>
              </div>
            );
          })}
        </>
      )}

      {/* AI banner sits at the bottom — the closing read on everything above */}
      <PortfolioHeadline headline={headline} loading={headlineLoading} />
    </div>
  );
}

function TrendChart({ journey }) {
  const stroke = RAG_SOLID[journey.rag];
  const vals = [...journey.trend, journey.metric.target, journey.benchmark].filter((v) => v != null);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.15 || 1;
  return (
    <div style={{ height: 110, marginTop: 12 }}>
      <ResponsiveContainer width="100%" height="100%">
        <AreaChart data={toSeries(journey.trend)} margin={{ top: 6, right: 8, bottom: 0, left: 0 }}>
          <CartesianGrid strokeDasharray="3 3" stroke="#F1F5F9" vertical={false} />
          <XAxis dataKey="x" tick={{ fontSize: 10, fill: C.muted }} axisLine={false} tickLine={false} />
          <YAxis domain={[lo - pad, hi + pad]} width={30} tick={{ fontSize: 10, fill: C.muted }} axisLine={false} tickLine={false} />
          <ReferenceLine y={journey.metric.target} stroke={C.green} strokeDasharray="4 4"
            label={{ value: "Target", position: "insideTopRight", fontSize: 9, fill: C.green }} />
          {journey.benchmark != null && (

            fill={stroke} fillOpacity={0.06} dot={{ r: 3, fill: stroke, strokeWidth: 0 }} />
        </AreaChart>
      </ResponsiveContainer>
    </div>
  );
}

    { key: "optimise", label: "Optimise", n: h.optimise, c: C.hypOptimise },
    { key: "differentiate", label: "Differentiate", n: h.differentiate, c: C.hypDifferentiate },
  ];
  return (

      <Label text="Hypothesis mix" style={{ marginBottom: 6 }} />

      <div style={{ display: "flex", gap: 12, marginTop: 7 }}>

  "Q2 closes with a single Key Result cleared — Payments beat its speed target — while CASA adoption (15% of the way) and technical experience (29%) are the deepest misses. All four objectives sit at-risk, and the pattern is structural: the journeys furthest from goal, CASA and Lending, also run the weakest improvement engines. Refund testing on both before Q3, or these gaps compound.";

const OKR_STATUS = {
  achieved: { label: "Achieved", color: C.green, bg: C.greenBg },
  ontrack: { label: "On track", color: C.green, bg: C.greenBg },
  atrisk: { label: "At risk", color: C.amber, bg: C.amberBg },
  offtrack: { label: "Off track", color: C.red, bg: C.redBg },
};

const SQUAD_SHORT = { acq: "Acquisition", everyday: "Everyday", lending: "Lending" };

function resolveKR(kr) {
  let baseline, target, current, unit, lower, journeyId = null, squad;
  if (kr.journeyId) {
    const j = JOURNEYS.find((x) => x.id === kr.journeyId);
    baseline = j.trend[0]; target = j.metric.target; current = j.metric.actual;
    unit = j.metric.unit; lower = j.metric.lower; journeyId = j.id;
    squad = SQUAD_SHORT[j.squadId];
  } else {
    ({ baseline, target, current, unit, lower } = kr.portfolio);
    squad = kr.portfolio.squad || "All squads";
  }
  const need = lower ? baseline - target : target - baseline;
  const done = lower ? baseline - current : current - baseline;
  const progress = need !== 0 ? clamp(done / need, 0, 1.5) : 1;
  const met = lower ? current <= target : current >= target;
  const status = met ? "achieved" : progress >= 0.67 ? "ontrack" : progress >= 0.33 ? "atrisk" : "offtrack";
  return { name: kr.label, baseline, target, current, unit, lower, journeyId, squad, progress, status, met };
}

function objRollup(obj) {
  const krs = obj.krs.map(resolveKR);
  const progress = krs.reduce((s, k) => s + Math.min(k.progress, 1), 0) / krs.length;
  const status = krs.every((k) => k.met) ? "achieved" : progress >= 0.67 ? "ontrack" : progress >= 0.33 ? "atrisk" : "offtrack";
  return { krs, progress, status };
}

function objEngine(journeyIds) {
  const js = journeyIds.map((id) => JOURNEYS.find((j) => j.id === id));
  const testActual = Math.round((js.reduce((s, j) => s + j.testing.actual, 0) / js.length) * 10) / 10;
  const testTarget = js[0].testing.target;
  const boldness = Math.round(js.reduce((s, j) => s + getBoldnessRatio(j.hypotheses), 0) / js.length);
  let act = 0, tot = 0;
  js.forEach((j) => { act += j.insights.actioned; tot += j.insights.new + j.insights.actioned + j.insights.deferred; });
  return { testActual, testTarget, boldness, insightPct: Math.round((act / tot) * 100) };
}

          <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
            <span style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 11, color: C.muted }}>O{index + 1}</span>
            <span style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 17 }}>{obj.name}</span>
          </div>
          <div style={{ fontFamily: FONT_BODY, fontSize: 12, color: C.secondary, marginTop: 3 }}>{obj.theme}</div>
        </div>
        <div style={{ textAlign: "right", flexShrink: 0 }}>
          <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 800, fontSize: 24, lineHeight: 1, color: st.color }}>{Math.round(progress * 100)}%</div>
          <span style={{ display: "inline-block", marginTop: 6, fontFamily: FONT_BODY, fontSize: 10, fontWeight: 600, color: st.color, background: st.bg, borderRadius: 6, padding: "3px 9px" }}>{st.label}</span>
        </div>
      </div>
      <div style={{ marginTop: 2 }}>
        <div style={{ display: "grid", gridTemplateColumns: "1.7fr 2fr 1.1fr auto", gap: 18, paddingBottom: 2 }}>
          {["Key result", "Progress", "Squad", "Status"].map((h, i) => (
            <span key={h} style={{ fontFamily: FONT_BODY, fontSize: 9, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.5px", color: C.muted, textAlign: i === 3 ? "right" : "left" }}>{h}</span>
          ))}
        </div>
        {krs.map((kr, i) => <KRRow key={i} kr={kr} onSelect={onSelect} />)}
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 20, marginTop: 14, paddingTop: 12, borderTop: `1px solid ${C.sep}`, flexWrap: "wrap" }}>
        <span style={{ fontFamily: FONT_BODY, fontSize: 10, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.5px", color: C.muted }}>Engine</span>
        <EngineChip label="Testing" value={`${eng.testActual}/${eng.testTarget}`} color={eng.testActual >= eng.testTarget ? C.green : eng.testActual >= eng.testTarget * 0.75 ? C.amber : C.red} />
        <EngineChip label="Boldness" value={`${eng.boldness}%`} color={eng.boldness >= 20 ? C.violet : C.muted} />
        <EngineChip label="Insights actioned" value={`${eng.insightPct}%`} color={eng.insightPct >= 67 ? C.green : eng.insightPct >= 40 ? C.amber : C.red} />
      </div>
    </WhiteCard>
  );
}

function OKRTally() {
  const counts = { achieved: 0, ontrack: 0, atrisk: 0, offtrack: 0 };
  OKRS.forEach((o) => o.krs.forEach((kr) => { counts[resolveKR(kr).status]++; }));
  const order = ["achieved", "ontrack", "atrisk", "offtrack"];
  return (
    <div style={{ display: "flex", gap: 10 }}>
      {order.map((s) => {
        const st = OKR_STATUS[s];
        return (
          <span key={s} style={{ display: "flex", alignItems: "center", gap: 6, fontFamily: FONT_BODY, fontSize: 11, color: C.secondary }}>
            <span style={{ width: 8, height: 8, borderRadius: "50%", background: st.color }} />
            <b style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, color: C.primary }}>{counts[s]}</b> {st.label}
          </span>
        );
      })}
    </div>
  );
}

function OKRView({ onSelect }) {
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 16 }}>
        <div>
          <span style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 22 }}>Objectives & Key Results</span>
          <div style={{ fontFamily: FONT_BODY, fontSize: 12, color: C.muted, marginTop: 3 }}>Q2 2026 · end-of-quarter scorecard</div>
        </div>
        <OKRTally />
      </div>

      {OKRS.map((obj, i) => <ObjectiveCard key={obj.id} obj={obj} index={i} onSelect={onSelect} />)}
    </div>
  );
}

/* ============================================================================
   DASHBOARD (root)  (section 4 + 5)
   ========================================================================== */
function Dashboard() {
  const [view, setView] = useState("command");
  const [selectedId, setSelectedId] = useState(null);
  const [board, setBoard] = useState("trajectory"); // "grid" | "flow" | "trajectory"
  const [infoOpen, setInfoOpen] = useState(false);

  const [narratives, setNarratives] = useState({});
  const [generating, setGenerating] = useState({});
  const [headline, setHeadline] = useState("");
  const [headlineLoading, setHeadlineLoading] = useState(false);

  const variantRef = useRef({});
  const selected = JOURNEYS.find((j) => j.id === selectedId);

  // mount: fire "headline" + all 8 narratives in parallel (mock LLM)
  useEffect(() => {
    setHeadlineLoading(true);
    mockLLM("headline", 0).then((text) => {
      setHeadline(text);
      setHeadlineLoading(false);
    });

    JOURNEYS.forEach((j) => {
      setGenerating((g) => ({ ...g, [j.id]: true }));
      mockLLM(j.id, 0).then((text) => {
        setNarratives((n) => ({ ...n, [j.id]: text }));
        setGenerating((g) => ({ ...g, [j.id]: false }));
      });
    });
  }, []);

  const regenerate = useCallback((j) => {
    setGenerating((g) => ({ ...g, [j.id]: true }));
    const v = (variantRef.current[j.id] || 0) + 1;
    variantRef.current[j.id] = v;
    mockLLM(j.id, v).then((text) => {
      setNarratives((n) => ({ ...n, [j.id]: text }));
      setGenerating((g) => ({ ...g, [j.id]: false }));
    });
  }, []);

  // any navigation (new view or drilling into a journey) returns to the top
  useEffect(() => { window.scrollTo(0, 0); }, [view, selectedId]);

  const navigate = (v) => { setView(v); setSelectedId(null); };
  const select = (id) => { setSelectedId(id); setView("detail"); };
  const back = () => { setView("command"); setSelectedId(null); };

  return (
    <div style={{ minHeight: "100vh", background: C.page }}>
      <TopBar currentView={view} onNavigate={navigate} onInfo={() => setInfoOpen(true)} />
      <div style={{ width: "100%", padding: "24px 36px 56px" }}>
        {view === "command" && (
          <CommandCentre headline={headline} headlineLoading={headlineLoading} onSelect={select} board={board} onBoard={setBoard} />
        )}
        {view === "detail" && selected && (
          <JourneyDetail
            journey={selected}
            onBack={back}
            narrative={narratives[selected.id]}
            loading={!!generating[selected.id]}
            onRegenerate={regenerate}
          />
        )}
        {view === "okrs" && <OKRView onSelect={select} />}
        {view === "insights" && <InsightsTracker />}
      </div>
      <DataFlowModal open={infoOpen} onClose={() => setInfoOpen(false)} />
    </div>
  );
}

createRoot(document.getElementById("root")).render(<Dashboard />);
</script>
